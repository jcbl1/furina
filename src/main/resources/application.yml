spring:
  application:
    name: furina
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/furina?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&useTimezone=true&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:my-secret-pw}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      auto-commit: true
      idle-timeout: 10000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  ai:
    vectorstore:
      elasticsearch:
        initialize-schema: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:furina-local-development-secret}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app:
  import-seed-data: false

file-storage:
  root-dir: ${FILE_STORAGE_ROOT:${user.dir}/src/main/resources/static/files}

server:
  port: 10240
  shutdown: graceful
